version: 2
updates:
  # GitHub Actions are natively supported by Dependabot.
  # (Scala/sbt dependency updates are handled by Scala Steward - see
  # .github/workflows/scala-steward.yml - because Dependabot has no sbt ecosystem.)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]
