name: Docs

# Builds the MkDocs (Material) site plus Scaladoc and deploys to GitHub Pages.
# Enable Pages once: Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '**/*.scala'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs Material
        run: pip install mkdocs-material mkdocs-minify-plugin

      - name: Generate Scaladoc
        run: sbt doc

      - name: Build MkDocs site
        run: mkdocs build --strict --site-dir site

      - name: Bundle Scaladoc into the site (/api)
        run: |
          set -euo pipefail
          api_dir=$(find . -type d -path '*/target/scala-3*/api' \
            | grep -E 'modules/client|/core/' | head -1)
          if [ -z "${api_dir:-}" ]; then
            api_dir=$(find . -type d -path '*/target/scala-3*/api' | head -1)
          fi
          echo "Using Scaladoc from: ${api_dir:-<none>}"
          if [ -n "${api_dir:-}" ]; then
            mkdir -p site/api
            cp -r "$api_dir"/. site/api/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
