name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Build & unit test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Check formatting
        if: matrix.java == '17'
        run: sbt scalafmtCheckAll scalafmtSbtCheck

      - name: Compile (all modules)
        run: sbt compile Test/compile

      - name: Unit tests
        # Arrow touches internal NIO buffers; open the modules for the forked test JVM.
        run: sbt test
        env:
          JDK_JAVA_OPTIONS: >-
            --add-opens=java.base/java.nio=ALL-UNNAMED
            --add-opens=java.base/sun.nio.ch=ALL-UNNAMED

  integration:
    name: Integration (Spark ${{ matrix.spark }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Spark 4.0.0+ ships a Scala 2.13 build that bundles the Connect server,
        # so the default tarball works and no --packages is needed. Spark 3.5.x
        # defaults to a Scala 2.12 build and does NOT bundle Connect, so we use
        # the Scala 2.13 distribution AND add the matching spark-connect_2.13
        # package. Version-specific features (e.g. Declarative Pipelines, 4.1+)
        # are skipped at runtime by the suites based on the server version.
        include:
          - spark: "4.1.2"
            dist: spark-4.1.2-bin-hadoop3
            packages: ""
          - spark: "4.0.0"
            dist: spark-4.0.0-bin-hadoop3
            packages: ""
          - spark: "3.5.5"
            dist: spark-3.5.5-bin-hadoop3-scala2.13
            packages: "--packages org.apache.spark:spark-connect_2.13:3.5.5"
    env:
      SPARK_REMOTE: sc://localhost:15002
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache Spark distribution
        id: spark-cache
        uses: actions/cache@v5
        with:
          path: ~/spark
          # Keyed on the distribution name so a Scala-version change busts the cache.
          key: ${{ matrix.dist }}

      - name: Download Apache Spark ${{ matrix.spark }}
        if: steps.spark-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/spark
          curl -fsSL "https://archive.apache.org/dist/spark/spark-${{ matrix.spark }}/${{ matrix.dist }}.tgz" \
            | tar xz -C ~/spark --strip-components=1

      - name: Start Spark Connect server
        run: |
          set -euo pipefail
          ~/spark/sbin/start-connect-server.sh ${{ matrix.packages }} --conf spark.log.level=WARN
          echo "Waiting for sc://localhost:15002 ..."
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/localhost/15002) >/dev/null 2>&1; then
              echo "Server is up."; exit 0
            fi
            sleep 2
          done
          echo "Server did not start in time"; cat ~/spark/logs/* || true; exit 1

      - name: Run integration tests
        run: sbt test
        env:
          JDK_JAVA_OPTIONS: >-
            --add-opens=java.base/java.nio=ALL-UNNAMED
            --add-opens=java.base/sun.nio.ch=ALL-UNNAMED

      - name: Stop Spark Connect server
        if: always()
        run: ~/spark/sbin/stop-connect-server.sh || true
