name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on pull requests, but let pushes to main run to
  # completion so the integration matrix is never cut short.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Format, compile, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache Coursier
        uses: actions/cache@v4
        with:
          path: ~/.cache/coursier
          key: coursier-${{ hashFiles('**/build.sbt', 'project/**') }}
          restore-keys: coursier-

      - name: Check formatting
        run: sbt scalafmtCheckAll

      - name: Compile
        run: sbt clean compile

      - name: Unit tests
        run: sbt test

  integration:
    name: Integration (Spark ${{ matrix.spark }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Pinned to the latest patch of each line, which the Apache CDN (dlcdn)
        # actively hosts. Older patches live only on the throttled archive mirror
        # and time out the 390 MB download in CI, so we always track the current
        # patch: 3.5.x, 4.0.x, 4.1.x.
        include:
          # Spark 3.5.x does not bundle the Connect server: use the Scala 2.13
          # distribution and pull the server in with --packages.
          - spark: "3.5.8"
            tarball: "spark-3.5.8-bin-hadoop3-scala2.13.tgz"
            packages: "--packages org.apache.spark:spark-connect_2.13:3.5.8"
          # Spark 4.0+ bundles the Connect server; the default tarball works.
          - spark: "4.0.3"
            tarball: "spark-4.0.3-bin-hadoop3.tgz"
            packages: ""
          - spark: "4.1.2"
            tarball: "spark-4.1.2-bin-hadoop3.tgz"
            packages: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache Coursier
        uses: actions/cache@v4
        with:
          path: ~/.cache/coursier
          key: coursier-${{ hashFiles('**/build.sbt', 'project/**') }}
          restore-keys: coursier-

      - name: Cache Spark distribution
        id: spark-cache
        uses: actions/cache@v4
        with:
          path: ~/spark
          key: spark-${{ matrix.spark }}-bin-hadoop3

      - name: Download Spark
        if: steps.spark-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/spark
          # The Apache CDN (dlcdn) only serves current releases, so older patch
          # versions (e.g. 3.5.6, 4.0.2) live only on the archive, which can be slow
          # or throttled. Try the CDN first, then make several resilient attempts at
          # the archive. A successful download is cached (keyed on the tarball name),
          # so this only has to succeed once per version.
          ok=false
          for base in "https://dlcdn.apache.org/spark" "https://archive.apache.org/dist/spark"; do
            url="$base/spark-${{ matrix.spark }}/${{ matrix.tarball }}"
            for attempt in 1 2 3 4 5; do
              echo "Downloading $url (attempt $attempt)"
              if curl -fL --retry 5 --retry-all-errors --retry-delay 15 \
                   --connect-timeout 30 --max-time 1200 "$url" -o /tmp/spark.tgz; then
                ok=true; break
              fi
              echo "Attempt $attempt failed for $url"
              sleep 20
            done
            [ "$ok" = "true" ] && break
            echo "Mirror failed: $url"
          done
          if [ "$ok" != "true" ]; then echo "All Spark mirrors failed"; exit 1; fi
          tar xzf /tmp/spark.tgz -C ~/spark --strip-components=1

      - name: Start Spark Connect server
        run: |
          set -euo pipefail
          # On Spark 4.0+ the Connect server is bundled (matrix.packages is empty).
          # On Spark 3.5.x it is pulled in via --packages (matrix.packages).
          ~/spark/sbin/start-connect-server.sh ${{ matrix.packages }} --conf spark.log.level=WARN
          # Wait for the gRPC port to accept connections, and fail the job if it never does
          # (otherwise the integration tests would fail later with an opaque connection error).
          for i in $(seq 1 60); do
            if bash -c "</dev/tcp/localhost/15002" 2>/dev/null; then
              echo "Spark Connect server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Spark Connect server did not become reachable on sc://localhost:15002" >&2
          tail -n 200 ~/spark/logs/*.out 2>/dev/null || true
          exit 1

      - name: Run integration tests
        env:
          SPARK_CONNECT_TEST_REMOTE: "sc://localhost:15002"
          SPARK_CONNECT_TEST_VERSION: ${{ matrix.spark }}
        run: sbt "client/testOnly *Integration*"

      - name: Dump server log on failure
        if: failure()
        run: tail -n 200 ~/spark/logs/*.out || true
