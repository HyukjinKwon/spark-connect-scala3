name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Format, compile, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache Coursier
        uses: actions/cache@v4
        with:
          path: ~/.cache/coursier
          key: coursier-${{ hashFiles('**/build.sbt', 'project/**') }}
          restore-keys: coursier-

      - name: Check formatting
        run: sbt scalafmtCheckAll

      - name: Compile
        run: sbt clean compile

      - name: Unit tests
        run: sbt test

  integration:
    name: Integration (Spark ${{ matrix.spark }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Spark 4.0+ ships a Scala 2.13 build that bundles the Connect server,
        # so the default tarball works and no --packages is needed.
        spark: ["4.0.2", "4.1.2"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache Coursier
        uses: actions/cache@v4
        with:
          path: ~/.cache/coursier
          key: coursier-${{ hashFiles('**/build.sbt', 'project/**') }}
          restore-keys: coursier-

      - name: Cache Spark distribution
        id: spark-cache
        uses: actions/cache@v4
        with:
          path: ~/spark
          key: spark-${{ matrix.spark }}-bin-hadoop3

      - name: Download Spark
        if: steps.spark-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/spark
          curl -L "https://archive.apache.org/dist/spark/spark-${{ matrix.spark }}/spark-${{ matrix.spark }}-bin-hadoop3.tgz" \
            | tar xz -C ~/spark --strip-components=1

      - name: Start Spark Connect server
        run: |
          # Spark 4.0+ bundles the Connect server, so no --packages is needed.
          # Leave SPARK_NO_DAEMONIZE unset so the server daemonizes and the
          # wait loop below can run.
          ~/spark/sbin/start-connect-server.sh --conf spark.log.level=WARN
          # Wait for the gRPC port to accept connections.
          for i in $(seq 1 60); do
            if bash -c "</dev/tcp/localhost/15002" 2>/dev/null; then
              echo "Spark Connect server is up"
              break
            fi
            sleep 2
          done

      - name: Run integration tests
        env:
          SPARK_CONNECT_TEST_REMOTE: "sc://localhost:15002"
        run: sbt "client/testOnly *Integration*"

      - name: Dump server log on failure
        if: failure()
        run: tail -n 200 ~/spark/logs/*.out || true
