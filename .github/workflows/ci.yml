name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Build & unit test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Check formatting
        if: matrix.java == '17'
        run: sbt scalafmtCheckAll scalafmtSbtCheck

      - name: Compile (all modules)
        run: sbt compile Test/compile

      - name: Unit tests
        # Arrow touches internal NIO buffers; open the modules for the forked test JVM.
        run: sbt test
        env:
          JDK_JAVA_OPTIONS: >-
            --add-opens=java.base/java.nio=ALL-UNNAMED
            --add-opens=java.base/sun.nio.ch=ALL-UNNAMED

  integration:
    name: Integration tests (live Spark Connect server)
    runs-on: ubuntu-latest
    env:
      SPARK_VERSION: 4.1.2
      HADOOP_PROFILE: hadoop3
      SPARK_REMOTE: sc://localhost:15002
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache Spark distribution
        id: spark-cache
        uses: actions/cache@v4
        with:
          path: ~/spark
          key: spark-${{ env.SPARK_VERSION }}-${{ env.HADOOP_PROFILE }}

      - name: Download Apache Spark ${{ env.SPARK_VERSION }}
        if: steps.spark-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/spark
          url="https://archive.apache.org/dist/spark/spark-${SPARK_VERSION}/spark-${SPARK_VERSION}-bin-${HADOOP_PROFILE}.tgz"
          echo "Downloading $url"
          curl -fsSL "$url" -o /tmp/spark.tgz
          tar xzf /tmp/spark.tgz -C ~/spark --strip-components=1

      - name: Start Spark Connect server
        run: |
          set -euo pipefail
          # Spark 4.0.0+ bundles the Spark Connect server, so no --packages is needed.
          ~/spark/sbin/start-connect-server.sh --conf spark.log.level=WARN
          echo "Waiting for sc://localhost:15002 ..."
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/localhost/15002) >/dev/null 2>&1; then
              echo "Server is up."; exit 0
            fi
            sleep 2
          done
          echo "Server did not start in time"; cat ~/spark/logs/* || true; exit 1

      - name: Run integration tests
        run: sbt test
        env:
          JDK_JAVA_OPTIONS: >-
            --add-opens=java.base/java.nio=ALL-UNNAMED
            --add-opens=java.base/sun.nio.ch=ALL-UNNAMED

      - name: Stop Spark Connect server
        if: always()
        run: ~/spark/sbin/stop-connect-server.sh || true
