name: Scala Steward

# Opens PRs to bump sbt/Scala dependencies and plugins. Runs weekly.
# Uses the default GITHUB_TOKEN; for cross-fork PRs configure a PAT as a secret.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    steps:
      - name: Run Scala Steward
        uses: scala-steward-org/scala-steward-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
