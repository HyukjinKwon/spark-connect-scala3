name: Release

# Publishes to Maven Central via sbt-ci-release.
#   - push to main          -> SNAPSHOT to the snapshots repository
#   - push of a vX.Y.Z tag  -> a signed release
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SONATYPE_USERNAME      Central Portal token username
#   SONATYPE_PASSWORD      Central Portal token password
#   PGP_SECRET             base64-encoded ASCII-armored secret key
#                          (gpg --armor --export-secret-keys KEY | base64 -w0)
#   PGP_PASSPHRASE         passphrase for the secret key

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sbt-dynver needs full history/tags for versioning

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Publish
        run: sbt ci-release
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
