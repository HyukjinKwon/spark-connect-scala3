name: Release

# Publishes to Maven Central (Sonatype Central) via sbt-ci-release when a
# version tag is pushed.
#
# Required repository secrets (read by sbt-ci-release):
#   PGP_SECRET        - base64-encoded PGP private key used to sign artifacts
#   PGP_PASSPHRASE    - passphrase for the PGP private key
#   SONATYPE_USERNAME - Sonatype Central user token name
#   SONATYPE_PASSWORD - Sonatype Central user token secret
on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # sbt-ci-release derives the version from the git tag; fetch tags.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Publish
        run: sbt ci-release
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
