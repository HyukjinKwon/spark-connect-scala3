name: Release

# Publishes the artifacts to Maven Central (via the Sonatype Central Portal) and
# creates a GitHub Release. Triggered by pushing a version tag, e.g.:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# sbt-ci-release derives the published version from the tag: `v0.1.0` -> `0.1.0`.
# A manual run (workflow_dispatch) without a tag publishes a -SNAPSHOT instead.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SONATYPE_USERNAME - Central Portal user token name  (central.sonatype.com -> Account -> Generate User Token)
#   SONATYPE_PASSWORD - Central Portal user token secret
#   PGP_SECRET        - base64-encoded ASCII-armored PGP private key (e.g. `gpg --armor --export-secret-keys KEY | base64`)
#   PGP_PASSPHRASE    - passphrase for that PGP key
#
# One-time setup: register/verify the `io.github.hyukjinkwon` namespace on the
# Central Portal and publish the public half of the PGP key to a keyserver.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # sbt-dynver derives the version from git tags; fetch full history + tags.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Publish to Maven Central
        run: sbt ci-release
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
