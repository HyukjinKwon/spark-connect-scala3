name: Release

# Publishes the artifacts to Maven Central (via the Sonatype Central Portal) and
# creates a GitHub Release. Triggered by pushing a version tag, e.g.:
#
#     git tag vX.Y.Z && git push origin vX.Y.Z
#
# sbt-ci-release derives the published version from the tag: `vX.Y.Z` -> `X.Y.Z`.
# A manual run (workflow_dispatch) without a tag publishes a -SNAPSHOT instead.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SONATYPE_USERNAME - Central Portal user token name  (central.sonatype.com -> Account -> Generate User Token)
#   SONATYPE_PASSWORD - Central Portal user token secret
#   PGP_SECRET        - base64-encoded ASCII-armored PGP private key (e.g. `gpg --armor --export-secret-keys KEY | base64`)
#   PGP_PASSPHRASE    - passphrase for that PGP key
#
# One-time setup: register/verify the `com.github.hyukjinkwon` namespace on the
# Central Portal and publish the public half of the PGP key to a keyserver.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # sbt-dynver derives the version from git tags; fetch full history + tags.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Publish to Maven Central
        run: sbt ci-release
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          # The Central Portal publish is: upload bundle -> poll status until PUBLISHED.
          # A single slow status poll used to time out (~5s socket read) and abort the
          # whole run *after* the bundle had already uploaded, losing the GitHub Release
          # step. Give the HTTP client generous connect/read timeouts (sun.net props are
          # honored by the sttp HttpURLConnection backend sbt-sonatype uses) so a slow
          # status response is tolerated rather than fatal.
          JAVA_OPTS: >-
            -Dsun.net.client.defaultConnectTimeout=120000
            -Dsun.net.client.defaultReadTimeout=600000

      # Creating the GitHub Release is decoupled from the publish step's exit status.
      # Rationale: once the bundle is uploaded, Central may finish publishing server-side
      # even if the client-side status poll flakes and the publish step reports failure
      # (the artifact is immutable, so it cannot be re-published). Running this with
      # `always()` on a tag ensures the release is still recorded. It is idempotent -- a
      # re-run that finds the release already present is treated as success.
      - name: Create GitHub Release
        if: ${{ always() && github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; nothing to do."
            exit 0
          fi
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --generate-notes
