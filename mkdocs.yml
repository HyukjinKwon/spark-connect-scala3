site_name: spark-connect-scala3
site_description: A native Scala 3 client for Apache Spark Connect.
site_author: Hyukjin Kwon
site_url: https://hyukjinkwon.github.io/spark-connect-scala3/
repo_name: HyukjinKwon/spark-connect-scala3
repo_url: https://github.com/HyukjinKwon/spark-connect-scala3
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Hyukjin Kwon - Apache License 2.0

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
  # Single fixed (light) palette: the dark/light toggle button is intentionally removed.
  palette:
    scheme: default
    primary: deep orange
    accent: orange
  icon:
    repo: fontawesome/brands/github
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HyukjinKwon/spark-connect-scala3

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
      - SparkSession: guide/sparksession.md
      - DataFrame & Dataset: guide/dataframe.md
      - Columns & Functions: guide/columns-and-functions.md
      - Aggregations & Windows: guide/aggregations-and-windows.md
      - Reading & Writing Data: guide/io.md
      - Running SQL: guide/sql.md
      - Catalog: guide/catalog.md
      - Structured Streaming: guide/streaming.md
      - Declarative Pipelines: guide/pipelines.md
      - Data Types & Schemas: guide/types.md
  - Reference:
      - Architecture: reference/architecture.md
      - Supported Features: reference/compatibility.md
      - Configuration: reference/configuration.md
  - Examples: examples.md
  - API Reference (Scaladoc): https://hyukjinkwon.github.io/spark-connect-scala3/api/
  - Contributing: contributing.md
